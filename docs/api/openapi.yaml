openapi: 3.0.3
info:
  title: BookLeaf Author Support API
  version: 0.2.0
  description: REST API for author and admin portals
servers:
  - url: http://localhost:4000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas: {}
  parameters: {}
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service health status
  /api/auth/login:
    post:
      summary: Login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 1
              required:
                - email
                - password
      responses:
        "200":
          description: JWT token and user profile
        "400":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
        "401":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
  /api/auth/me:
    get:
      summary: Current user profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User profile
        "401":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
  /api/auth/logout:
    post:
      summary: Logout (stateless — client clears JWT)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
        "401":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
  /api/author/books:
    get:
      summary: List author books
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Array of books
        "401":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
        "403":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
  /api/author/books/{bookId}:
    get:
      summary: Get book detail
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: bookId
          in: path
      responses:
        "200":
          description: Book detail
        "401":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
        "403":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
        "404":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
  /api/author/books/{bookId}/sales:
    get:
      summary: Book sales breakdown
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            minLength: 1
          required: true
          name: bookId
          in: path
      responses:
        "200":
          description: Sales rows
        "401":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
        "404":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
  /api/author/tickets:
    get:
      summary: List author tickets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Array of tickets
        "401":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
    post:
      summary: Create ticket (triggers AI classify)
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bookId:
                  type: string
                  nullable: true
                subject:
                  type: string
                  minLength: 1
                  maxLength: 500
                description:
                  type: string
                  minLength: 1
                  maxLength: 10000
              required:
                - bookId
                - subject
                - description
      responses:
        "201":
          description: Created ticket
        "400":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
  /api/author/tickets/stream:
    get:
      summary: SSE stream of author tickets
      security:
        - bearerAuth: []
      responses:
        "200":
          description: text/event-stream
  /api/author/tickets/{id}/stream:
    get:
      summary: SSE stream of single ticket
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: text/event-stream
  /api/author/tickets/{id}:
    get:
      summary: Get author ticket
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Ticket with messages
        "404":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
  /api/author/tickets/{id}/attachments/{attachmentId}:
    get:
      summary: Download ticket attachment
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
        - schema:
            type: string
            format: uuid
          required: true
          name: attachmentId
          in: path
      responses:
        "200":
          description: File download
        "404":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
  /api/admin/tickets:
    get:
      summary: Admin ticket queue
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            enum: &a1
              - open
              - in_progress
              - resolved
              - closed
          required: false
          name: status
          in: query
        - schema:
            type: string
            enum: &a2
              - royalty_payments
              - isbn_metadata
              - printing_quality
              - distribution_availability
              - book_status_production
              - general_inquiry
          required: false
          name: category
          in: query
        - schema:
            type: string
            enum: &a3
              - critical
              - high
              - medium
              - low
          required: false
          name: priority
          in: query
        - schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          required: false
          name: from
          in: query
        - schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          required: false
          name: to
          in: query
      responses:
        "200":
          description: Filtered ticket list
        "401":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
        "403":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
  /api/admin/tickets/stream:
    get:
      summary: SSE stream of admin ticket queue
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            enum: *a1
          required: false
          name: status
          in: query
        - schema:
            type: string
            enum: *a2
          required: false
          name: category
          in: query
        - schema:
            type: string
            enum: *a3
          required: false
          name: priority
          in: query
        - schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          required: false
          name: from
          in: query
        - schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          required: false
          name: to
          in: query
      responses:
        "200":
          description: text/event-stream
  /api/admin/tickets/{id}:
    get:
      summary: Get admin ticket with cached AI draft
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Ticket detail
        "404":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
    patch:
      summary: Update ticket status, category, priority, assignee
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: *a1
                category:
                  type: string
                  enum: *a2
                priority:
                  type: string
                  enum: *a3
                assigned_admin_ref:
                  type: string
                  nullable: true
                  format: uuid
                category_overridden:
                  type: boolean
                priority_overridden:
                  type: boolean
      responses:
        "200":
          description: Updated ticket
        "400":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
        "404":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
  /api/admin/tickets/{id}/draft:
    post:
      summary: Generate or regenerate AI draft response
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: AI draft content
        "404":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
        "503":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
  /api/admin/tickets/{id}/attachments/{attachmentId}:
    get:
      summary: Download ticket attachment
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
        - schema:
            type: string
            format: uuid
          required: true
          name: attachmentId
          in: path
      responses:
        "200":
          description: File download
        "404":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
  /api/admin/tickets/{id}/responses:
    post:
      summary: Send admin response to author
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 10000
              required:
                - content
      responses:
        "200":
          description: Updated ticket
        "400":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
  /api/admin/tickets/{id}/notes:
    get:
      summary: List internal notes
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Internal notes
    post:
      summary: Add internal note
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            format: uuid
          required: true
          name: id
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 10000
              required:
                - content
      responses:
        "201":
          description: Created note
        "400":
          description: Error
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  statusCode:
                    type: number
                required:
                  - message
