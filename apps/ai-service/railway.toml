[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/ai-service/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

# Env vars are NOT defined here — Railway requires dashboard/CLI setup.
# Copy deploy/railway.ai-service.env → ai-service → Variables → RAW Editor
# Required: GEMINI_API_KEY, GEMINI_MODEL (remove legacy OPENAI_* if present)
