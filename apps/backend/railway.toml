[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/backend/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Attach a Railway volume at /data/uploads in the dashboard for persistent ticket attachments.
# Set env: UPLOAD_DIR=/data/uploads, MAX_UPLOAD_BYTES=5242880
